name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Test
        run: uv run python -m unittest discover tests -v

  terraform:
    # Job name stays "Terraform" (a required check); one step per module.
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive src/panos_decrypt_bypass/terraform
      - name: SCM module (validate, mocked-provider tests)
        working-directory: src/panos_decrypt_bypass/terraform/scm
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test
      - name: Local firewall module (validate, mocked-provider tests)
        working-directory: src/panos_decrypt_bypass/terraform/local
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: panos-decrypt-bypass:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (demo mode)
        run: |
          docker run -d --name pdb -p 8088:8088 -e WEBGUI_DEMO=1 -e WEBGUI_PASSWORD=ci-password-1234 panos-decrypt-bypass:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' pdb)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' pdb | grep -qx healthy
          curl -fsS http://127.0.0.1:8088/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/status)" = 401
          docker exec pdb terraform version
          docker exec pdb panos-decrypt-bypass version
      - name: Both modules initialise offline from the bundled providers
        run: |
          for module in scm local; do
            docker run --rm --network none --entrypoint sh panos-decrypt-bypass:ci -c "
              cp -r \"\$(python -c 'from panos_decrypt_bypass.workspace import TERRAFORM_DIR; print(TERRAFORM_DIR)')/$module\" /tmp/tf &&
              cd /tmp/tf && terraform init -backend=false -input=false -lockfile=readonly -no-color"
          done
      - if: failure()
        run: docker logs pdb
