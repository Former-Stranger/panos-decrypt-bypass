# panos-decrypt-bypass behind Caddy for HTTPS. Copy this folder, add .env (from
# the repo's .env.example), pick a Caddyfile, then: docker compose up -d
services:
  panos-decrypt-bypass:
    image: ghcr.io/former-stranger/panos-decrypt-bypass:${PDB_VERSION:-latest}
    container_name: panos-decrypt-bypass
    restart: unless-stopped
    env_file: .env
    environment:
      WEBGUI_PORT: "8088"
      WEBGUI_COOKIE_SECURE: "true"
    # Not published on the host: only Caddy reaches it.
    expose:
      - "8088"
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    container_name: panos-decrypt-bypass-caddy
    restart: unless-stopped
    depends_on:
      - panos-decrypt-bypass
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-decrypt.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # For Caddyfile.step-ca: the private CA's root certificate.
      # - ./root_ca.pem:/etc/caddy/root_ca.pem:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
